name: Liquidify Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquidify-release
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'

jobs:
  patches:
    name: Build patches from source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build extension, generate native hooks and package patches
        run: |
          chmod +x gradlew
          python -m pip install -r requirements-build.txt
          python tools/build_patches.py
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: liquidify-built-patches
          if-no-files-found: error
          path: |
            patches/
            experimental-patches/
            reports/probe-linkage.json
            reports/package-alpha.json
            reports/design-resources-build.json
            reports/strict-patches-alpha22.json

  release:
    name: Build Manager and prepare release draft
    needs: patches
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: liquidify-built-patches
          path: .
      - name: Validate prepared patch payload and release identity
        run: |
          python tools/validate_release.py
          python - <<'PY'
          import json, os
          release=json.load(open('release.json'))
          if os.environ['GITHUB_REF_TYPE']=='tag':
              assert os.environ['GITHUB_REF_NAME']==release['tag'], 'Tag must match release.json'
          PY
      - name: Decode stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LIQUIDIFY_SIGNING_KEYSTORE }}
          SIGNING_PASSWORD: ${{ secrets.LIQUIDIFY_SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.LIQUIDIFY_SIGNING_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$SIGNING_PASSWORD" ] || [ -z "$SIGNING_ALIAS" ]; then
            echo "::error::Configure LIQUIDIFY_SIGNING_KEYSTORE, LIQUIDIFY_SIGNING_PASSWORD and LIQUIDIFY_SIGNING_ALIAS in this repository's Actions secrets."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/liquidify-release.jks"
      - name: Test and build Liquidify Manager
        working-directory: radiant-base/Manager
        env:
          RELEASE: 'true'
          SIGNING_STORE_FILE: ${{ runner.temp }}/liquidify-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.LIQUIDIFY_SIGNING_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.LIQUIDIFY_SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.LIQUIDIFY_SIGNING_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
      - name: Prepare and verify release assets
        run: |
          python tools/prepare_release_assets.py radiant-base/Manager/app/build/outputs/apk/release/app-release.apk
          python tools/verify_release_signature.py release-assets/Liquidify-Manager-*.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging release-assets/Liquidify-Manager-*.apk | grep -Fx "application-label:'Liquidify Manager'"
          (cd release-assets && sha256sum --check SHA256SUMS)
      - name: Retain tested assets
        uses: actions/upload-artifact@v4
        with:
          name: liquidify-release
          path: release-assets/*
          if-no-files-found: error
      - name: Create GitHub Beta release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(python -c 'import json;print(json.load(open("release.json"))["tag"])')
          title=$(python -c 'import json;print(json.load(open("release.json"))["title"])')
          if gh release view "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Release or tag $tag already exists; choose a new version instead of overwriting it."
            exit 1
          fi
          gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title "$title" --notes-file RELEASE_NOTES.md --draft --prerelease
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/liquidify-release.jks"
